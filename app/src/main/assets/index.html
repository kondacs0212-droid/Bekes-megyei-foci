<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Békés megyei foci</title><style>
*{box-sizing:border-box}body{font-family:system-ui,Arial;margin:0;background:#f0f5f1;color:#173724}header{background:#126b39;color:white;padding:20px 16px}h1{font-size:24px;margin:0}small{color:#cdebd6}main{padding:14px;max-width:750px;margin:auto}.card{background:white;border-radius:13px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}button{background:#176b3e;color:white;border:0;border-radius:9px;padding:10px 12px;margin:3px;font-size:15px}button.alt{background:#e3eee7;color:#174e2e}input,select{width:100%;padding:10px;border:1px solid #baccc0;border-radius:8px;margin:5px 0 12px;font:inherit}label{display:block;font-weight:600}nav{display:flex;gap:5px;overflow:auto}nav button{white-space:nowrap}.hidden{display:none}.muted{color:#6a7d71;font-size:13px}.score{font-size:23px;font-weight:800}.event{padding:8px;border-bottom:1px solid #eee}.error{color:#9b2424}.ok{color:#176b3e}details{margin-top:8px}summary{cursor:pointer;font-weight:bold}</style></head><body>
<header><h1>⚽ Békés megyei foci</h1><small>Élő eredmények és mérkőzésesemények • fejlesztői teszt</small></header><main>
<div class="card"><div id="status" class="muted">Kapcsolódás a Firebase-hez…</div><button id="login" onclick="Android.login()">Google adminbelépés</button><button id="logout" class="alt hidden" onclick="Android.logout()">Kilépés</button><div id="error" class="error"></div></div>
<nav><button onclick="tab('matches')">Mérkőzések</button><button onclick="tab('standings')">Tabella</button><button onclick="tab('fixtures')">Következő meccsek</button><button onclick="tab('players')">Játékosok</button><button onclick="tab('admin')">Admin</button></nav>
<section id="matches"></section><section id="standings" class="hidden"></section><section id="fixtures" class="hidden"></section><section id="players" class="hidden"></section><section id="admin" class="hidden"></section>
</main><script>
let matches=[],players=[],isAdmin=false,auth={},current='matches';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function receiveNative(event,raw){try{if(event==='error'){$('error').textContent=raw;return}let v=JSON.parse(raw);if(event==='matches')matches=v;if(event==='players')players=v;if(event==='auth'){auth=v;isAdmin=!!v.admin;$('status').textContent=!v.signedIn?'Nyilvános nézet • belépés nélkül':(v.admin?'Admin: ':'Belépve, adminjog nélkül: ')+(v.email||'');$('login').classList.toggle('hidden',!!v.signedIn);$('logout').classList.toggle('hidden',!v.signedIn)}render()}catch(e){$('error').textContent=e.message}}
function tab(t){current=t;for(let x of ['matches','standings','fixtures','players','admin'])$(x).classList.toggle('hidden',x!==t);render()}
function render(){renderMatches();renderStandings();renderFixtures();renderPlayers();renderAdmin()}
function renderMatches(){let out='<h2>Mérkőzések</h2>';if(!matches.length)out+='<p class="muted">Még nincsenek mérkőzések. A valós MLSZ-adatok importálása még nem történt meg.</p>';
for(let m of matches){let ev=Array.isArray(m.events)?m.events:[];out+=`<article class="card"><div class="muted">${esc(m.group||'Csoport nélkül')} · ${esc(m.kickoff||'Időpont nélkül')} · ${esc(m.status||'Tervezett')}</div><div class="score">${esc(m.home)} ${esc(m.homeScore??0)} : ${esc(m.awayScore??0)} ${esc(m.away)}</div><details><summary>Meccs részletei (${ev.length} esemény)</summary>${ev.map(e=>`<div class="event">${esc(e.minute)}' ${esc(e.type)} · ${esc(e.team)} ${esc(e.player||'')}</div>`).join('')||'<p>Még nincs esemény.</p>'}${isAdmin?`<hr><label>Új esemény</label><select id="type-${m.id}"><option>Gól</option><option>Öngól</option><option>Sárga lap</option><option>Piros lap</option></select><select id="team-${m.id}"><option>${esc(m.home)}</option><option>${esc(m.away)}</option></select><select id="player-${m.id}">${players.map(p=>`<option value="${esc(p.name)}">${esc(p.name)} (${esc(p.team)})</option>`).join('')}<option value="">Ismeretlen játékos</option></select><input type="number" id="minute-${m.id}" placeholder="Perc" min="0" max="130"><button onclick="addEvent('${m.id}')">Esemény mentése</button>`:''}</details></article>`} $('matches').innerHTML=out}
function addEvent(id){if(!isAdmin)return;let m=matches.find(x=>x.id===id);if(!m)return;let type=$('type-'+id).value,team=$('team-'+id).value,player=$('player-'+id).value,minute=Number($('minute-'+id).value);if(!Number.isFinite(minute)||minute<0||minute>130){alert('Érvényes percet adj meg!');return}let copy={...m};delete copy.id;copy.events=[...(m.events||[]),{type,team,player,minute}];if(type==='Gól'){if(team===m.home)copy.homeScore=Number(m.homeScore||0)+1;else copy.awayScore=Number(m.awayScore||0)+1}if(type==='Öngól'){if(team===m.home)copy.awayScore=Number(m.awayScore||0)+1;else copy.homeScore=Number(m.homeScore||0)+1}Android.saveMatch(id,JSON.stringify(copy))}
function renderPlayers(){$('players').innerHTML='<h2>Játékosok</h2>'+players.map(p=>`<div class="card">${esc(p.name)} <span class="muted">${esc(p.team)}</span></div>`).join('')+(players.length?'':'<p>Játékosadatok még nincsenek feltöltve.</p>')}
function renderAdmin(){$('admin').innerHTML='<h2>Adminisztráció</h2>'+(!isAdmin?'<p>Csak jóváhagyott adminok rögzíthetnek eredményt.</p>':`<div class="card"><h3>Új mérkőzés</h3><label>Csoport<input id="mgroup" placeholder="Például: Északi csoport"></label><label>Forduló<input id="round" type="number" min="1" placeholder="Forduló száma"></label><label>Hazai csapat<input id="home"></label><label>Vendégcsapat<input id="away"></label><label>Kezdés (év-hó-nap óra:perc)<input id="kickoff" placeholder="2026-10-31 14:00"></label><button onclick="newMatch()">Mérkőzés létrehozása</button></div><div class="card"><h3>Új játékos</h3><label>Név<input id="pname"></label><label>Csapat<input id="pteam"></label><button onclick="newPlayer()">Játékos hozzáadása</button></div>`)}
function newMatch(){let home=$('home').value.trim(),away=$('away').value.trim(),kickoff=$('kickoff').value.trim(),group=$('mgroup').value.trim(),round=Number($('round').value)||null;if(!home||!away||!kickoff)return alert('Tölts ki minden mezőt!');Android.saveMatch('',JSON.stringify({home,away,kickoff,group,round,status:'Tervezett',homeScore:0,awayScore:0,events:[]}))}
function newPlayer(){let name=$('pname').value.trim(),team=$('pteam').value.trim();if(!name||!team)return alert('Tölts ki minden mezőt!');Android.savePlayer('',JSON.stringify({name,team}))}

function isFinished(m){let x=String(m.status||'').toLowerCase();return ['vége','végeredmény','befejezett','finished','final'].some(y=>x.includes(y))}
function kickDate(m){let t=String(m.kickoff||'').trim().replace(' ','T');let d=new Date(t);return Number.isFinite(d.getTime())?d:null}
function groupNames(){return [...new Set(matches.map(m=>m.group||'Csoport nélkül'))].sort((a,b)=>a.localeCompare(b,'hu'))}
function filterControl(id,handler){let opts=groupNames().map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');let el=$(id),old=el?el.value:'Összes csoport';return `<label>Csoport<select id="${id}" onchange="${handler}()"><option>Összes csoport</option>${opts}</select></label>`}
function selectedGroup(id){return $(id)?.value||'Összes csoport'}
function filtered(group){return matches.filter(m=>group==='Összes csoport'||(m.group||'Csoport nélkül')===group)}
function renderStandings(){let chosen=selectedGroup('standGroup');let groups=groupNames();let out='<h2>🏆 Tabella</h2><p class="muted">Csak a befejezettként jelölt, Firestore-ban tárolt mérkőzésekből számolva. Nem hivatalos MLSZ-tabella; a pontlevonásokat és versenyszabály szerinti holtversenyeket nem kezeli.</p>'+filterControl('standGroup','renderStandings');
for(let g of groups.filter(x=>chosen==='Összes csoport'||x===chosen)){let data=new Map();function ensure(n){if(!data.has(n))data.set(n,{n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});return data.get(n)}
for(let m of filtered(g)){if(m.home)ensure(m.home);if(m.away)ensure(m.away);if(!isFinished(m))continue;let h=ensure(m.home),a=ensure(m.away),hs=Number(m.homeScore||0),as=Number(m.awayScore||0);h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;if(hs>as){h.w++;a.l++;h.pts+=3}else if(hs<as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}}
let rows=[...data.values()].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.n.localeCompare(b.n,'hu'));out+=`<div class="card"><h3>${esc(g)}</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px"><thead><tr><th>#</th><th style="text-align:left">Csapat</th><th>M</th><th>Gy</th><th>D</th><th>V</th><th>Gól</th><th>P</th></tr></thead><tbody>`+rows.map((r,i)=>`<tr style="border-top:1px solid #e3eee7"><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}:${r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('')+'</tbody></table></div>'+(rows.length?'':'<p>Még nincsenek csapatok ebben a csoportban.</p>')+'</div>'}
if(!groups.length)out+='<div class="card">Még nincs feltöltött mérkőzés.</div>';$('standings').innerHTML=out;if($('standGroup'))$('standGroup').value=chosen}
function renderFixtures(){let chosen=selectedGroup('fixtureGroup');let now=new Date();let upcoming=filtered(chosen).filter(m=>!isFinished(m)).sort((a,b)=>(kickDate(a)?.getTime()??Infinity)-(kickDate(b)?.getTime()??Infinity));let out='<h2>📅 Következő mérkőzések</h2><p class="muted">A Firestore-ba felvitt, még be nem fejezett mérkőzések. A múltbeli időpontú, lezáratlan meccsek is láthatók, hogy az admin javíthassa az állapotukat.</p>'+filterControl('fixtureGroup','renderFixtures');out+=upcoming.map(m=>`<div class="card"><div class="muted">${esc(m.group||'Csoport nélkül')} ${m.round?'· '+esc(m.round)+'. forduló':''}</div><b>${esc(m.home||'?')} – ${esc(m.away||'?')}</b><div>${esc(m.kickoff||'Időpont még nincs')}</div><div class="muted">${esc(m.status||'Tervezett')}</div></div>`).join('')||'<div class="card">Nincs megjeleníthető mérkőzés.</div>';$('fixtures').innerHTML=out;if($('fixtureGroup'))$('fixtureGroup').value=chosen}

render();</script></body></html>
