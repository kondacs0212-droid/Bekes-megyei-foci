<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Békés megyei foci</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Arial;margin:0;background:#f0f5f1;color:#173724}
header{background:#126b39;color:white;padding:20px 16px}
h1{font-size:24px;margin:0}
small{color:#cdebd6}
main{padding:14px;max-width:750px;margin:auto}
.card{background:white;border-radius:13px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
button{background:#176b3e;color:white;border:0;border-radius:9px;padding:10px 12px;margin:3px;font-size:15px}
button.alt{background:#e3eee7;color:#174e2e}
button.danger{background:#b42323}
input,select{width:100%;padding:10px;border:1px solid #baccc0;border-radius:8px;margin:5px 0 12px;font:inherit}
label{display:block;font-weight:600}
nav{display:flex;gap:5px;overflow:auto}
nav button{white-space:nowrap}
.hidden{display:none!important}
.muted{color:#6a7d71;font-size:13px}
.score{font-size:23px;font-weight:800}
.event{padding:10px 0;border-bottom:1px solid #eee}
.error{color:#9b2424}
.ok{color:#176b3e}
details{margin-top:8px}
summary{cursor:pointer;font-weight:bold}
.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}
.dialog{background:white;border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;box-shadow:0 6px 30px #0004}
/* Az üres hibajelzés ne foglaljon helyet a fejléc alatt. */
.admin-message-card:has(#error:empty){display:none}
</style>
<link rel="stylesheet" href="modern.css">
<script src="megjelenes.js" defer></script>
</head>
<body>

<header>
<h1>⚽ Békés megyei foci</h1>
<small>Élő szöveges közvetítés és értesítések</small>
</header>

<main>
<div class="card admin-message-card" id="adminMessageCard">
<div id="error" class="error" role="alert"></div>
</div>

<nav>
<button onclick="tab('matches')">Mérkőzések</button>
<button onclick="tab('fixtures')">Következő meccsek</button>
<button onclick="tab('players')">Játékosok</button>
<button onclick="tab('admin')">Admin</button>
</nav>

<section id="matches"></section>
<section id="fixtures" class="hidden"></section>
<section id="players" class="hidden"></section>
<section id="adminAccess" class="hidden">
<div class="card">
<div id="status" class="muted">Kapcsolódás a Firebase-hez…</div>
<div id="login">
<label>E-mail-cím</label>
<input id="loginEmail" type="email" autocomplete="username">
<label>Jelszó</label>
<input id="loginPassword" type="password" autocomplete="current-password">
<button onclick="loginEmail()">Adminbelépés</button>
</div>
<button id="logout" class="alt hidden" onclick="Android.logout()">Kilépés</button>
</div>
</section>
<section id="admin" class="hidden"></section>
</main>

<div id="deleteOverlay" class="overlay hidden" role="dialog" aria-modal="true">
<div class="dialog">
<h2>Mérkőzés törlése</h2>
<p>Biztosan végleg törölni szeretnéd?</p>
<strong id="deleteName"></strong>
<p class="error">A törlés nem vonható vissza.</p>
<button class="alt" onclick="cancelDelete()">Mégse</button>
<button class="danger" onclick="confirmDelete()">Igen, törlés</button>
</div>
</div>

<div id="editOverlay" class="overlay hidden" role="dialog" aria-modal="true">
<div class="dialog">
<h2 id="editTitle">Esemény szerkesztése</h2>

<label>Esemény típusa</label>
<select id="editType">
<option>Gól</option>
<option>Öngól</option>
<option>Sárga lap</option>
<option>Piros lap</option>
<option>Csere</option>
</select>

<label>Csapat</label>
<select id="editTeam" onchange="refreshEditPlayers()"></select>

<label>Játékos</label>
<select id="editPlayer"></select>

<label>Játékos neve kézzel (ha nincs a listában)</label>
<input id="editManualPlayer" placeholder="Nem kötelező">

<label>Perc</label>
<input id="editMinute" type="number" min="0" max="130">

<button onclick="saveEditedEvent()">💾 Mentés</button>
<button class="alt" onclick="closeEdit()">Mégse</button>
</div>
</div>

<script>
let matches=[];
let players=[];
let isAdmin=false;
let auth={};
let current='matches';
let pendingDeleteId=null;
let fcmToken='';
let editing=null;
let openDetails=new Set();

const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));

function loginEmail(){
const email=$('loginEmail').value.trim();
const password=$('loginPassword').value;
if(!email||!password){
$('error').textContent='Add meg az e-mail-címedet és a jelszavadat.';
return;
}
$('error').textContent='';
Android.login(email,password);
}

function receiveNative(event,raw){
try{
if(event==='error'){
$('error').textContent=raw;
return;
}
if(event==='notificationTriggered'){
return;
}
if(event==='fcmToken'){
fcmToken=String(raw||'').trim();
$('error').textContent=fcmToken?
'FCM-azonosító sikeresen lekérve.':
'Üres FCM-azonosító érkezett.';
renderAdmin();
return;
}
if(event==='tokenCopied'){
$('error').textContent=String(raw||'Azonosító másolva.');
return;
}
if(event==='matchDeleted'){
$('error').textContent='A mérkőzés sikeresen törölve.';
return;
}

const v=JSON.parse(raw);

if(event==='matches'){
matches=v;
if(pendingDeleteId&&!matches.some(m=>m.id===pendingDeleteId)){
cancelDelete();
}
}
if(event==='players'){players=v;playersLoaded=true;maybeImportKardosRoster();}

if(event==='auth'){
auth=v;
isAdmin=!!v.admin;
maybeImportKardosRoster();
if(!isAdmin)fcmToken='';
$('status').textContent=!v.signedIn?
'Nyilvános nézet • belépés nélkül':
(v.admin?'Admin: ':'Belépve, adminjog nélkül: ')+(v.email||'');
$('login').classList.toggle('hidden',!!v.signedIn);
$('logout').classList.toggle('hidden',!v.signedIn);
if(v.signedIn)$('loginPassword').value='';
}

render();
}catch(e){
$('error').textContent=e.message;
}
}

function tab(t){
current=t;
for(const x of ['matches','fixtures','players','admin']){
$(x).classList.toggle('hidden',x!==t);
}
$('adminAccess').classList.toggle('hidden',t!=='admin');
render();
}

function render(){
renderMatches();
renderFixtures();
renderPlayers();
renderAdmin();
}

function clockText(m){
if(m.status==='Félidő')return '45:00 • szünet';
if(m.status==='Vége')return 'Vége';
if(m.status!=='Élő')return 'Még nem indult el';
const start=Date.parse(m.periodStartedAt||'');
if(!Number.isFinite(start))return 'ÉLŐ';
const seconds=Math.max(0,Math.floor((Date.now()-start)/1000));
const base=Number(m.period)===2?45:0;
return `${base+Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
}

function matchById(id){
return matches.find(m=>m.id===id);
}

function makeId(){
return 'e_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);
}

function validMinute(value){
const s=String(value??'').trim();
if(!s)return null;
const n=Number(s);
return Number.isInteger(n)&&n>=0&&n<=130?n:null;
}

function playerOptions(team,selected=''){
const names=players
.filter(p=>String(p.team||'').trim().toLocaleLowerCase('hu')===
String(team||'').trim().toLocaleLowerCase('hu'))
.map(p=>String(p.name||'').trim())
.filter(Boolean);

if(selected&&!names.includes(selected))names.unshift(selected);

return '<option value="">Nincs megadva</option>'+
names.map(name=>
`<option value="${esc(name)}" ${name===selected?'selected':''}>${esc(name)}</option>`
).join('');
}

function renderMatches(){
let out='<h2>Mérkőzések</h2>';

if(!matches.length){
out+='<p class="muted">Még nincsenek mérkőzések.</p>';
}

for(const m of matches){
const ev=Array.isArray(m.events)?m.events:[];
const state=m.status||'Tervezett';
const id=esc(m.id);
let controls='';

if(isAdmin){
if(state==='Tervezett'){
controls+=`<button onclick="matchAction('${id}','start')">▶ Meccs indítása</button>`;
}else if(state==='Élő'&&Number(m.period)!==2){
controls+=`<button onclick="matchAction('${id}','half')">⏸ Félidő</button>`;
}else if(state==='Félidő'){
controls+=`<button onclick="matchAction('${id}','resume')">▶ Második félidő</button>`;
}
if(state==='Élő'){
controls+=`<button onclick="matchAction('${id}','finish')">🏁 Mérkőzés vége</button>`;
}
controls+=`<button class="danger" onclick="deleteMatch('${id}')">🗑 Mérkőzés törlése</button>`;
}

const eventsHtml=ev.map((e,index)=>`
<div class="event">
<div>
<strong>${esc(e.minute)}' ${esc(e.type)}</strong>
· ${esc(e.team||'')}
${e.player?' · '+esc(e.player):'<span class="muted"> · Játékos nincs megadva</span>'}
</div>
${isAdmin?`
<button class="alt" onclick="editEvent('${id}',${index})">✏️ Szerkesztés</button>
<button class="danger" onclick="deleteEvent('${id}',${index})">Törlés</button>
`:''}
</div>`).join('')||'<p>Még nincs esemény.</p>';

const canAdd=isAdmin&&['Élő','Félidő','Vége'].includes(state);

out+=`
<article class="card">
<div class="muted">
${esc(m.group||'Csoport nélkül')}
· ${esc(m.kickoff||'Időpont nélkül')}
· ${esc(state)}
</div>
<div>
${state==='Élő'?'<strong style="color:#c52222">🔴 ÉLŐ</strong>':''}
<span class="matchclock" data-id="${id}">${esc(clockText(m))}</span>
</div>
<div class="score">
${esc(m.home)} ${esc(m.homeScore??0)} :
${esc(m.awayScore??0)} ${esc(m.away)}
</div>
${controls}
<details data-match="${id}" ${openDetails.has(m.id)?'open':''}
ontoggle="rememberDetails(this)">
<summary>Meccs részletei (${ev.length} esemény)</summary>
${eventsHtml}

${canAdd?`
<hr>
<h3>➕ Új esemény</h3>
<label>Típus</label>
<select id="type-${id}">
<option>Gól</option>
<option>Öngól</option>
<option>Sárga lap</option>
<option>Piros lap</option>
<option>Csere</option>
</select>

<label>Csapat</label>
<select id="team-${id}" onchange="refreshNewPlayers('${id}')">
<option value="${esc(m.home)}">${esc(m.home)}</option>
<option value="${esc(m.away)}">${esc(m.away)}</option>
</select>

<label>Játékos</label>
<select id="player-${id}"></select>

<label>Játékos neve kézzel (ha nincs a listában)</label>
<input id="manual-${id}" placeholder="Nem kötelező">

<label>Perc</label>
<input id="minute-${id}" type="number" min="0" max="130" placeholder="Perc">

<button onclick="addEvent('${id}')">💾 Esemény mentése</button>
`:''}
</details>
</article>`;
}

$('matches').innerHTML=out;

for(const m of matches){
const select=$('player-'+m.id);
if(select)refreshNewPlayers(m.id);
}
}

function rememberDetails(el){
const id=el.dataset.match;
if(!id)return;
if(el.open)openDetails.add(id);
else openDetails.delete(id);
}

function refreshNewPlayers(id){
const team=$('team-'+id)?.value||'';
const select=$('player-'+id);
if(select)select.innerHTML=playerOptions(team);
}

function showMatchMessage(text){
$('error').textContent=text;
$('error').scrollIntoView({behavior:'smooth'});
}

function saveMatchObject(id,obj){
const copy={...obj};
delete copy.id;
Android.saveMatch(id,JSON.stringify(copy));
}

function matchAction(id,action){
if(!isAdmin)return showMatchMessage('Nincs adminjogosultság.');

const m=matchById(id);
if(!m)return showMatchMessage('Nem található a mérkőzés.');

const state=m.status||'Tervezett';
const next={
start:'Élő',
half:'Félidő',
resume:'Élő',
finish:'Vége'
}[action];

const allowed={
start:state==='Tervezett',
half:state==='Élő'&&Number(m.period)!==2,
resume:state==='Félidő',
finish:state==='Élő'
};

if(!next||!allowed[action]){
return showMatchMessage('A művelet nem végezhető el. Állapot: '+state);
}

const copy={...m};
copy.status=next;

if(action==='start'){
copy.period=1;
copy.actualStartedAt=new Date().toISOString();
copy.periodStartedAt=copy.actualStartedAt;
}
if(action==='resume'){
copy.period=2;
copy.periodStartedAt=new Date().toISOString();
}
if(action==='half')copy.halftimeAt=new Date().toISOString();
if(action==='finish')copy.finishedAt=new Date().toISOString();

saveMatchObject(id,copy);
showMatchMessage('Művelet elküldve, várakozás a Firebase frissítésére.');
}

function eventScoreDelta(e,m){
let home=0,away=0;

if(e.type==='Gól'){
if(e.team===m.home)home=1;
else if(e.team===m.away)away=1;
}

if(e.type==='Öngól'){
if(e.team===m.home)away=1;
else if(e.team===m.away)home=1;
}

return {home,away};
}

function updateScoresForChange(copy,m,oldEvent,newEvent){
let home=Number(m.homeScore||0);
let away=Number(m.awayScore||0);

if(oldEvent){
const d=eventScoreDelta(oldEvent,m);
home-=d.home;
away-=d.away;
}
if(newEvent){
const d=eventScoreDelta(newEvent,m);
home+=d.home;
away+=d.away;
}

if(home<0||away<0){
showMatchMessage('Az eredmény nem lehet negatív. Ellenőrizd a korábbi gólokat!');
return false;
}

copy.homeScore=home;
copy.awayScore=away;
return true;
}

function addEvent(id){
if(!isAdmin)return showMatchMessage('Nincs adminjogosultság.');

const m=matchById(id);
if(!m)return;

if(!['Élő','Félidő','Vége'].includes(m.status)){
return showMatchMessage('Eseményt a mérkőzés kezdése után lehet rögzíteni.');
}

const type=$('type-'+id).value;
const team=$('team-'+id).value;
const manual=$('manual-'+id).value.trim();
const player=manual||$('player-'+id).value;
const minute=validMinute($('minute-'+id).value);

if(minute===null){
return showMatchMessage('Adj meg egy egész percet 0 és 130 között!');
}

const e={
id:makeId(),
type,
team,
player,
minute
};

const copy={...m};
copy.events=[...(m.events||[]),e];

if(!updateScoresForChange(copy,m,null,e))return;

openDetails.add(id);
saveMatchObject(id,copy);
showMatchMessage('Esemény mentése elküldve.');
}

function editEvent(id,index){
if(!isAdmin)return;

const m=matchById(id);
if(!m||!Array.isArray(m.events)||!m.events[index])return;

const e=m.events[index];

editing={matchId:id,index};

$('editTitle').textContent='✏️ Esemény szerkesztése';
$('editType').value=e.type||'Gól';

$('editTeam').innerHTML=`
<option value="${esc(m.home)}">${esc(m.home)}</option>
<option value="${esc(m.away)}">${esc(m.away)}</option>`;

$('editTeam').value=e.team||m.home;
refreshEditPlayers(e.player||'');

$('editMinute').value=e.minute??'';
$('editManualPlayer').value='';

$('editOverlay').classList.remove('hidden');
}

function refreshEditPlayers(selected=''){
const team=$('editTeam').value;
const select=$('editPlayer');
select.innerHTML=playerOptions(team,selected);
}

function closeEdit(){
editing=null;
$('editOverlay').classList.add('hidden');
}

function saveEditedEvent(){
if(!isAdmin||!editing)return;

const {matchId,index}=editing;
const m=matchById(matchId);

if(!m||!Array.isArray(m.events)||!m.events[index]){
closeEdit();
return showMatchMessage('Az esemény már nem található.');
}

const minute=validMinute($('editMinute').value);

if(minute===null){
return showMatchMessage('Adj meg egy egész percet 0 és 130 között!');
}

const oldEvent=m.events[index];
const manual=$('editManualPlayer').value.trim();

const updated={
...oldEvent,
type:$('editType').value,
team:$('editTeam').value,
player:manual||$('editPlayer').value,
minute
};

const copy={...m};
copy.events=[...m.events];
copy.events[index]=updated;

if(!updateScoresForChange(copy,m,oldEvent,updated))return;

openDetails.add(matchId);
saveMatchObject(matchId,copy);
closeEdit();
showMatchMessage('Az esemény módosítása elküldve.');
}

function deleteEvent(id,index){
if(!isAdmin)return;

const m=matchById(id);
if(!m||!Array.isArray(m.events)||!m.events[index])return;

const e=m.events[index];

if(!confirm(
`Biztosan törlöd ezt az eseményt?\n${e.minute}' ${e.type} ${e.player||''}`
))return;

const copy={...m};
copy.events=m.events.filter((_,i)=>i!==index);

if(!updateScoresForChange(copy,m,e,null))return;

openDetails.add(id);
saveMatchObject(id,copy);
showMatchMessage('Esemény törlése elküldve.');
}

function deleteMatch(id){
if(!isAdmin)return showMatchMessage('A törléshez adminjog szükséges.');

const m=matchById(id);
if(!m)return showMatchMessage('Nem található a mérkőzés.');

pendingDeleteId=id;
$('deleteName').textContent=(m.home||'Hazai')+' – '+(m.away||'Vendég');
$('deleteOverlay').classList.remove('hidden');
}

function cancelDelete(){
pendingDeleteId=null;
$('deleteOverlay').classList.add('hidden');
}

function confirmDelete(){
const id=pendingDeleteId;
if(!id||!isAdmin){
cancelDelete();
return;
}
Android.deleteMatch(id);
cancelDelete();
showMatchMessage('Törlési kérés elküldve.');
}

setInterval(()=>{
document.querySelectorAll('.matchclock').forEach(el=>{
const m=matchById(el.dataset.id);
if(m)el.textContent=clockText(m);
});
},1000);

let playersLoaded=false;
let rosterImportBusy=false;
const kardosRoster=["TUSJAK CSABA", "KORBELY JÁNOS JÓZSEF", "HORVÁTH ZOLTÁN", "OLÁH ATTILA", "NAGY ISTVÁN DÁNIEL", "MENÁRIK NORBERT", "HÓDI TAMÁS", "KOZSUCH JÁNOS MARCELL", "FÜRI ZOLTÁN", "JURÁK GYÖRGY", "MAGINYECZ MÁTÉ JÁNOS", "KINCSES LEÓ", "KOMÁROMI KRISZTIÁN", "KURUCZ JÁNOS", "FEJES JÁNOS DÁVID", "BAGI ANDRÁS ZSOLT", "BATTA SZABOLCS", "TAMÁSI ISTVÁN", "JANSIK KRISZTIÁN"];

function maybeImportKardosRoster(){
if(!isAdmin||!playersLoaded||rosterImportBusy)return;
if(localStorage.getItem('kardosRoster2026Imported')==='yes')return;
rosterImportBusy=true;
const existing=new Set(players.filter(p=>String(p.team||'').trim().toLocaleLowerCase('hu')==='kardos ksk').map(p=>String(p.name||'').trim().toLocaleLowerCase('hu')));
const missing=kardosRoster.filter(n=>!existing.has(n.toLocaleLowerCase('hu')));
if(missing.length){
  for(const name of missing)Android.savePlayer('',JSON.stringify({name,team:'Kardos KSK'}));
  showMatchMessage(`${missing.length} Kardos KSK-játékos automatikus felvitele elindult.`);
}
localStorage.setItem('kardosRoster2026Imported','yes');
rosterImportBusy=false;
}

function editRosterPlayer(id){
if(!isAdmin)return;
const p=players.find(x=>x.id===id);
if(!p)return showMatchMessage('A játékos nem található.');
const name=prompt('Játékos neve:',p.name||'');
if(name===null)return;
if(!name.trim())return showMatchMessage('A név nem lehet üres.');
const team=prompt('Csapat:',p.team||'');
if(team===null)return;
if(!team.trim())return showMatchMessage('A csapat nem lehet üres.');
const copy={...p,name:name.trim(),team:team.trim()};
delete copy.id;
Android.savePlayer(id,JSON.stringify(copy));
showMatchMessage('Játékos módosítása elküldve.');
}

function deletePlayer(id){
if(!isAdmin)return;
const p=players.find(x=>x.id===id);
if(!p)return;
if(!confirm(`Biztosan törlöd a játékost?\n${p.name} – ${p.team}`))return;
if(typeof Android.deletePlayer!=='function')return showMatchMessage('A játékos törléséhez az új MainActivity.java is szükséges.');
Android.deletePlayer(id);
showMatchMessage('Játékos törlése elküldve.');
}

function renderPlayers(){
let out='<h2>Játékosok</h2>';

const existingNames=new Set(players.filter(p=>String(p.team||'').trim().toLocaleLowerCase('hu')==='kardos ksk').map(p=>String(p.name||'').trim().toLocaleLowerCase('hu')));
const builtIn=localStorage.getItem('kardosRoster2026Imported')==='yes'?[]:kardosRoster.filter(n=>!existingNames.has(n.toLocaleLowerCase('hu'))).map(name=>({name,team:'Kardos KSK',builtin:true}));
const displayPlayers=[...players,...builtIn];
out+=displayPlayers.length?
[...displayPlayers].sort((a,b)=>String(a.team||'').localeCompare(String(b.team||''),'hu')||String(a.name||'').localeCompare(String(b.name||''),'hu')).map(p=>`
<div class="card">
<b>${esc(p.name||'Névtelen')}</b>
<div class="muted">${esc(p.team||'')}</div>
${isAdmin&&!p.builtin?`<button class="alt" onclick="editRosterPlayer('${esc(p.id)}')">✏️ Szerkesztés</button><button class="danger" onclick="deletePlayer('${esc(p.id)}')">🗑 Törlés</button>`:''}
</div>`).join(''):
'<div class="card">Még nincsenek felvitt játékosok.</div>';
$('players').innerHTML=out;
}

function requestFcmToken(){
if(isAdmin)Android.getFcmToken();
}

function copyFcmToken(){
if(fcmToken)Android.copyFcmToken(fcmToken);
}

function renderAdmin(){
$('admin').innerHTML='<h2>Adminisztráció</h2>'+
(!isAdmin?
'<p>Csak jóváhagyott adminok rögzíthetnek eredményt.</p>':
`
<div class="card">
<h3>🔔 Értesítési teszt</h3>
<p class="muted">A készülék FCM-azonosítója. Ne oszd meg nyilvánosan.</p>
<button onclick="requestFcmToken()">FCM-azonosító lekérése</button>
${fcmToken?`
<p style="overflow-wrap:anywhere;user-select:text;font-size:12px">${esc(fcmToken)}</p>
<button onclick="copyFcmToken()">Azonosító másolása</button>`:''}
</div>

<div class="card">
<h3>Új mérkőzés</h3>
<label>Csoport<input id="mgroup" placeholder="Például: Északi csoport"></label>
<label>Forduló<input id="round" type="number" min="1"></label>
<label>Hazai csapat<input id="home"></label>
<label>Vendégcsapat<input id="away"></label>
<label>Kezdés (dátum és időpont)<input id="kickoff" type="datetime-local" step="60"></label>
<button onclick="newMatch()">Mérkőzés létrehozása</button>
</div>

<div class="card">
<h3>Új játékos</h3>
<label>Név<input id="pname"></label>
<label>Csapat<input id="pteam"></label>
<button onclick="newPlayer()">Játékos hozzáadása</button>
</div>`);
}

function newMatch(){
const home=$('home').value.trim();
const away=$('away').value.trim();
const kickoff=$('kickoff').value.trim().replace('T',' ');
const group=$('mgroup').value.trim();
const round=Number($('round').value)||null;

if(!home||!away||!kickoff){
return showMatchMessage('Töltsd ki a csapatokat és a kezdési időpontot!');
}

Android.saveMatch('',JSON.stringify({
home,away,kickoff,group,round,
status:'Tervezett',
homeScore:0,
awayScore:0,
events:[]
}));

showMatchMessage('Mérkőzés létrehozása elküldve.');
}

function newPlayer(){
const name=$('pname').value.trim();
const team=$('pteam').value.trim();

if(!name||!team){
return showMatchMessage('Tölts ki minden mezőt!');
}

Android.savePlayer('',JSON.stringify({name,team}));
showMatchMessage('Játékos mentése elküldve.');
}

function isFinished(m){
const x=String(m.status||'').toLowerCase();
return ['vége','végeredmény','befejezett','finished','final']
.some(y=>x.includes(y));
}

function kickDate(m){
const t=String(m.kickoff||'').trim().replace(' ','T');
const d=new Date(t);
return Number.isFinite(d.getTime())?d:null;
}

function groupNames(){
return [...new Set(matches.map(m=>m.group||'Csoport nélkül'))]
.sort((a,b)=>a.localeCompare(b,'hu'));
}

function filterControl(id,handler){
const opts=groupNames().map(g=>
`<option value="${esc(g)}">${esc(g)}</option>`
).join('');

return `<label>Csoport
<select id="${id}" onchange="${handler}()">
<option>Összes csoport</option>
${opts}
</select>
</label>`;
}

function selectedGroup(id){
return $(id)?.value||'Összes csoport';
}

function filtered(group){
return matches.filter(m=>
group==='Összes csoport'||
(m.group||'Csoport nélkül')===group
);
}

function renderFixtures(){
const chosen=selectedGroup('fixtureGroup');

const upcoming=filtered(chosen)
.filter(m=>!isFinished(m))
.sort((a,b)=>
(kickDate(a)?.getTime()??Infinity)-
(kickDate(b)?.getTime()??Infinity)
);

let out='<h2>📅 Következő mérkőzések</h2>'+
'<p class="muted">A Firestore-ba felvitt, még be nem fejezett mérkőzések.</p>'+
filterControl('fixtureGroup','renderFixtures');

out+=upcoming.map(m=>`
<div class="card">
<div class="muted">
${esc(m.group||'Csoport nélkül')}
${m.round?'· '+esc(m.round)+'. forduló':''}
</div>
<b>${esc(m.home||'?')} – ${esc(m.away||'?')}</b>
<div>${esc(m.kickoff||'Időpont még nincs')}</div>
<div class="muted">${esc(m.status||'Tervezett')}</div>
</div>
`).join('')||'<div class="card">Nincs megjeleníthető mérkőzés.</div>';

$('fixtures').innerHTML=out;

if($('fixtureGroup'))$('fixtureGroup').value=chosen;
}

render();
</script>
</body>
</html>
