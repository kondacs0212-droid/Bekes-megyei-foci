
name: Create Android Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore bekes-foci.jks \
            -alias bekesfoci \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Bekes Megyei Foci, O=Private App, C=HU"
          keytool -list -v \
            -keystore bekes-foci.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep SHA1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-keystore
          path: bekes-foci.jks
          retention-days: 1
