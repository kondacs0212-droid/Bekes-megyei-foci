name: Foci értesítések

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: foci-ertesitesek
  cancel-in-progress: false

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Firebase Admin SDK telepítése
        run: npm install --no-save firebase-admin

      - name: Értesítési program futtatása
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/foci-ertesitesek.js
